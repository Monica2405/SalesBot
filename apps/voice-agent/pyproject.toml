[project]
name = "salesbot-agent"
version = "0.1.0"
description = "Realtime voice agent (Pipecat). Providers for STT/LLM/TTS/telephony are swappable."
requires-python = ">=3.12,<3.13"
dependencies = [
    "salesbot-core",
    "pipecat-ai>=0.0.90",
    "pydantic-settings>=2.6",
]

[project.scripts]
salesbot-agent = "salesbot_agent.__main__:main"

[tool.uv.sources]
salesbot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesbot_agent"]
