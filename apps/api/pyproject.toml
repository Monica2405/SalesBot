[project]
name = "salesbot-api"
version = "0.1.0"
description = "HTTP API: webhooks (telephony, WhatsApp, Google), booking logic, server-side Supabase access"
requires-python = ">=3.12,<3.13"
dependencies = [
    "salesbot-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
]

[tool.uv.sources]
salesbot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesbot_api"]
